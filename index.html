<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Study Planner — generate smart daily & weekly study schedules from your subjects, exams, priorities and available time." />
  <title>Focus — AI Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app-shell">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-name">Focus</span>
      </div>
      <nav class="nav" aria-label="Sections">
        <a class="nav-link" href="#/dashboard" data-route="dashboard"></a>
        <a class="nav-link" href="#/create" data-route="create"></a>
        <a class="nav-link" href="#/today" data-route="today"></a>
        <a class="nav-link" href="#/week" data-route="week"></a>
        <a class="nav-link" href="#/subjects" data-route="subjects"></a>
        <a class="nav-link" href="#/analytics" data-route="analytics"></a>
        <a class="nav-link" href="#/notes" data-route="notes"></a>
        <a class="nav-link" href="#/mock" data-route="mock"></a>
        <a class="nav-link" href="#/wellness" data-route="wellness"></a>
        <a class="nav-link" href="#/career" data-route="career"></a>
        <a class="nav-link" href="#/settings" data-route="settings"></a>
      </nav>
      <div class="sidebar-foot">
        <div class="streak-badge" id="sidebarStreak" title="Current study streak"></div>
      </div>
    </aside>

    <div id="overlay" class="overlay" hidden></div>

    <!-- Main -->
    <div class="app-main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="topbar-title">
          <h1 id="pageTitle" class="page-title">Dashboard</h1>
          <p id="pageSubtitle" class="page-subtitle"></p>
        </div>
        <div class="topbar-actions">
          <button id="themeBtn" class="icon-btn" aria-label="Toggle color theme"></button>
          <a href="#/create" class="btn btn-primary btn-sm topbar-cta">New plan</a>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="js/store.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/mock-bank.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views-tools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
